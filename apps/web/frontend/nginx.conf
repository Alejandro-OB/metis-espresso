# Caché del navegador (19-oct-2026). Vite pone el hash del contenido en el
# nombre de cada archivo de /assets/: uno nuevo es otro nombre, así que se
# guardan un año sin riesgo de servir una versión vieja. Todo lo demás —la
# página de entrada, sw.js, el manifiesto— se revalida siempre, porque es lo
# que apunta a los archivos de la versión vigente. La API no lleva cabecera
# aquí: lo que es dato vivo lo decide el backend, y por omisión no se guarda.
# Va en un map y no en cada location porque un add_header dentro de una
# location anula los de seguridad del servidor.
map $uri $static_cache_control {
  ~^/api/   "";
  /events   "";
  ~^/assets/ "public, max-age=31536000, immutable";
  default   "no-cache";
}

# El registro lleva lo que tardó cada petición ($request_time) y lo que tardó
# el servidor ($upstream_response_time): con el formato por omisión no se
# distinguía una espera en la red, en nginx o en la API (26-oct-2026).
log_format con_tiempos '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                       'rt=$request_time urt=$upstream_response_time';

server {
  access_log /var/log/nginx/access.log con_tiempos;
  listen 8080;
  server_name _;
  client_max_body_size 1m;
  root /usr/share/nginx/html;
  index index.html;

  # El código pesa unos 400 KB y llega por la wifi del celular a la Raspberry:
  # comprimido baja a menos de un tercio. Incluye las respuestas JSON de la API.
  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # El servidor se busca por nombre en cada petición, con el DNS de Docker, y
  # no una sola vez al arrancar (26-oct-2026). Con `proxy_pass http://api:8000`
  # nginx guardaba la dirección del contenedor; al recrearlo en un despliegue
  # cambiaba, y la placa y el navegador recibían 502 «Connection refused» hasta
  # reiniciar esta parte. La variable obliga a resolver con `resolver`.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:8000;

  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /events {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ready';
  }

  add_header Cache-Control $static_cache_control;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
