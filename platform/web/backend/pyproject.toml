[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aplicacion-web-backend"
version = "0.1.0"
description = "API histórica y semántica para el prototipo de café espresso"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "fastapi==0.141.1",
  "fmpy==0.3.29",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.32",
  "pyshacl==0.30.1",
  "rdflib==7.6.0",
  "starlette==1.6.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aplicacion_web"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "../../packages"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["aplicacion_web"]
