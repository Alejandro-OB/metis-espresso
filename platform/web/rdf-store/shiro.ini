# Autenticación del almacén RDF. Las funciones de administración exigen la
# contraseña declarada en ADMIN_PASSWORD; la comprobación de salud y el estado
# quedan abiertos para el healthcheck del orquestador. El servicio no publica
# puertos fuera de la red interna del despliegue.
[main]
plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

[users]
admin=cambiar-en-el-despliegue

[roles]

[urls]
/$/status  = anon
/$/ping    = anon
/$/metrics = anon
/$/**      = authcBasic,user[admin]
/**        = anon
