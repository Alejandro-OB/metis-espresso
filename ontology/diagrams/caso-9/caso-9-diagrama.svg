<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1396" viewBox="0 0 1800 1396" role="img">
<title>Caso 9</title>
<style><![CDATA[
    :root{--paper:#fffefa;--ink:#2b3749;--green:#347848;--blue:#2876ad;--teal:#288479;--purple:#7250a0;--orange:#d9602e;--gold:#b67912;--gray:#8995a2}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{padding:18px;background:#ece8e1;color:var(--ink);font-family:"DejaVu Sans","Noto Sans",sans-serif}.sheet{width:1800px;margin:auto;overflow:hidden;border:1px solid #d7d1c8;background:var(--paper);box-shadow:0 14px 36px rgba(49,40,31,.10)}
    header{display:grid;grid-template-columns:455px 1fr;gap:34px;align-items:center;min-height:132px;padding:23px 31px;border-bottom:1px solid #ddd7cf}.eyebrow{margin:0 0 5px;color:#c75528;font-size:11px;font-weight:850;letter-spacing:1px;text-transform:uppercase}h1{margin:0;color:#40271e;font-family:"DejaVu Serif","Noto Serif",serif;font-size:54px;line-height:1;letter-spacing:-2px}.context{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;margin:0}.context div{min-height:78px;padding:11px 15px;border-left:3px solid #d9ae87;background:#fcfaf6}.context dt{margin:0 0 6px;color:#c75528;font-size:10px;font-weight:850;letter-spacing:.7px;text-transform:uppercase}.context dd{margin:0;font-size:12px;font-weight:650;line-height:1.45}
    svg{display:block;width:1800px;height:auto;background:var(--paper)}.node rect{stroke-width:1.8;filter:url(#shadow)}.node text{font-size:13px;font-weight:700;text-anchor:middle}.node .kind{font-size:8.5px;font-weight:850;letter-spacing:.8px;opacity:.78}.node .type,.node .detail{font-size:10.5px;font-weight:600}.actor rect,.calibration rect{fill:#eef7f0;stroke:var(--green)}.actor text,.calibration text{fill:#326c40}.profile rect{fill:#fff5ec;stroke:var(--orange)}.profile text{fill:#a84722}.process rect,.observation rect,.specification rect{fill:#f0f8fc;stroke:var(--blue)}.process text,.observation text,.specification text{fill:#235f8a}.sensory rect,.defect rect,.status rect{fill:#f5f1fb;stroke:var(--purple)}.sensory text,.defect text,.status text{fill:#62418f}.assessment rect{fill:#edf8f6;stroke:var(--teal)}.assessment text{fill:#236e67}.diagnosis rect{fill:#fff4ec;stroke:var(--orange)}.diagnosis text{fill:#9d4220}.explanation rect,.recommendation rect,.guidance rect{fill:#fff9ed;stroke:var(--gold)}.explanation text,.recommendation text,.guidance text{fill:#76521a}.engine rect{fill:#fbfcfd;stroke:var(--gray);stroke-width:1.5;stroke-dasharray:6 5}.engine .kind{fill:#687583}.engine .main{fill:#344155;font-size:13px;font-weight:780}.engine .result{fill:#a44826;font-size:12px;font-weight:760}.engine .detail{fill:#657181;font-size:10.5px}
    .edge{fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.domain{stroke:var(--green);marker-end:url(#ag)}.obs-edge{stroke:var(--blue);marker-end:url(#ab)}.sens-edge{stroke:var(--purple);marker-end:url(#ap)}.operation{stroke:var(--gray);stroke-dasharray:6 5;marker-end:url(#ay)}.provenance{stroke:var(--blue);stroke-dasharray:2 5;marker-end:url(#ab)}.diagnostic-edge{stroke:var(--orange);stroke-dasharray:2 5;marker-end:url(#ao)}.knowledge-edge{stroke:var(--gold);marker-end:url(#ak)}.label{font-size:10.5px;font-weight:780;text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round}.green{fill:#356e42}.blue{fill:#286495}.purple{fill:#67448f}.gray{fill:#6a7684}.orange{fill:#b94d23}.gold{fill:#8b5e11}
    footer{display:flex;align-items:center;justify-content:space-between;min-height:68px;padding:15px 28px;background:#faf8f4;color:#5d6878;font-size:10.5px;font-weight:700}.legend{display:flex;gap:24px}.legend span{display:flex;align-items:center;gap:8px}.sample{width:30px;border-top:2px solid var(--green)}.sample.obs{border-color:var(--blue)}.sample.op{border-color:var(--gray);border-top-style:dashed}.sample.prov{border-color:var(--blue);border-top-style:dotted}.sample.diag{border-color:var(--orange);border-top-style:dotted}.sample.know{border-color:var(--gold)}footer p{margin:0}
  

      .export-header-bg { fill: #fffdfa; }
      .export-separator { stroke: #ddd7ce; stroke-width: 1; }
      .export-eyebrow { fill: #c9582b; font: 800 11px 'DejaVu Sans','Noto Sans',sans-serif; letter-spacing: 1px; }
      .export-title { fill: #3f271e; font-family: 'DejaVu Serif','Noto Serif',serif; font-weight: 700; }
      .export-title-short { font-size: 47px; }
      .export-title-long { font-size: 32px; }
      .export-context { fill: #fcfaf6; }
      .export-context-rule { fill: #d7b18f; }
      .export-context-term { fill: #c9582b; font: 800 11px 'DejaVu Sans','Noto Sans',sans-serif; letter-spacing: .5px; }
      .export-context-description { fill: #354155; font: 650 12px 'DejaVu Sans','Noto Sans',sans-serif; }
      .export-footer-bg { fill: #faf8f4; }
      .export-legend, .export-footer-note { fill: #596477; font: 700 10.5px 'DejaVu Sans','Noto Sans',sans-serif; }
    ]]></style>
<rect x="0" y="0" width="1800" height="1396" fill="#fffdfa"/>
<g id="cabecera" aria-label="Cabecera del diagrama"><rect class="export-header-bg" x="0" y="0" width="1800" height="140"/><text class="export-eyebrow" x="28" y="27" text-anchor="start"><tspan x="28" dy="0">ONTOLOGÍA DEL PROCESO DE EXTRACCIÓN DE ESPRESSO · ESCENARIO SINTÉTICO</tspan></text><text class="export-title export-title-short" x="28" y="78" text-anchor="start"><tspan x="28" dy="0">Caso 9</tspan></text><rect class="export-context" x="684" y="24" width="536" height="93" rx="4"/><rect class="export-context-rule" x="684" y="24" width="3" height="93"/><text class="export-context-term" x="699" y="45" text-anchor="start"><tspan x="699" dy="0">SITUACIÓN</tspan></text><text class="export-context-description" x="699" y="65" text-anchor="start"><tspan x="699" dy="0">El TDS y el rendimiento de extracción están dentro de los rangos</tspan><tspan x="699" dy="16">esperados, pero el barista percibe un sabor desagradable persistente y</tspan><tspan x="699" dy="16">rechaza la calibración.</tspan></text><rect class="export-context" x="1236" y="24" width="536" height="93" rx="4"/><rect class="export-context-rule" x="1236" y="24" width="3" height="93"/><text class="export-context-term" x="1251" y="45" text-anchor="start"><tspan x="1251" dy="0">PREGUNTA</tspan></text><text class="export-context-description" x="1251" y="65" text-anchor="start"><tspan x="1251" dy="0">¿Por qué el barista no aprobó la extracción si los valores técnicos</tspan><tspan x="1251" dy="16">estaban dentro de los rangos esperados?</tspan></text><line class="export-separator" x1="0" y1="139" x2="1800" y2="139"/></g>
<g id="diagrama" transform="translate(0 140)">
<title id="title">Recorrido semántico del caso 9</title><desc id="desc">La ontología separa la conformidad técnica de la aceptación sensorial. El razonador materializa que la extracción cumple el perfil, pero la calibración fue rechazada debido al defecto sensorial registrado por el barista.</desc>
    <defs><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#293448" flood-opacity=".08"/></filter><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#347848"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2876ad"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7250a0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9602e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b67912"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8995a2"/></marker></defs>

    <!-- Actor y entidades iniciales -->
    <g class="node actor"><rect x="760" y="18" width="280" height="72" rx="9"/><text x="900" y="36"><tspan class="kind" x="900">ACTOR</tspan><tspan x="900" dy="22">BaristaA</tspan><tspan class="type" x="900" dy="18">Barista</tspan></text></g>
    <g class="node calibration"><rect x="50" y="145" width="300" height="100" rx="9"/><text x="200" y="164"><tspan class="kind" x="200">CALIBRACIÓN</tspan><tspan x="200" dy="22">C9Calibration</tspan><tspan class="type" x="200" dy="18">EspressoCalibration</tspan><tspan class="detail" x="200" dy="17">usesProfile → perfil_001</tspan></text></g>
    <g class="node process"><rect x="430" y="145" width="320" height="100" rx="9"/><text x="590" y="164"><tspan class="kind" x="590">EXTRACCIÓN DE PRUEBA</tspan><tspan x="590" dy="22">C9Extraction</tspan><tspan class="type" x="590" dy="18">EspressoExtraction · 28 s</tspan><tspan class="detail" x="590" dy="17">producesBeverage → C9Beverage</tspan></text></g>
    <g class="node sensory"><rect x="840" y="137" width="330" height="116" rx="9"/><text x="1005" y="155"><tspan class="kind" x="1005">EVALUACIÓN SENSORIAL</tspan><tspan x="1005" dy="21">C9Sensory</tspan><tspan class="type" x="1005" dy="17">SensoryEvaluation</tspan><tspan class="detail" x="1005" dy="16">hasSensoryAcceptanceStatus</tspan><tspan class="detail" x="1005" dy="15">→ SensoryRejected · agrado global 3/9 · sabor 3/9</tspan></text></g>
    <g class="node profile"><rect x="1390" y="145" width="300" height="100" rx="9"/><text x="1540" y="164"><tspan class="kind" x="1540">PERFIL DE EXTRACCIÓN</tspan><tspan x="1540" dy="22">perfil_001</tspan><tspan class="type" x="1540" dy="18">ExtractionProfile</tspan><tspan class="detail" x="1540" dy="17">definedBy → BaristaA</tspan></text></g>

    <path class="edge domain" d="M200 145C270 68 550 62 760 54"/><text class="label green" x="480" y="74">performedBy</text>
    <path class="edge domain" d="M590 145C650 105 745 82 800 76"/><text class="label green" x="700" y="102">performedBy</text>
    <path class="edge domain" d="M1005 137C1000 116 978 101 960 90"/><text class="label green" x="970" y="112">evaluatedBy</text>
    <path class="edge domain" d="M350 195L430 195"/><text class="label green" x="390" y="182">hasTrialExtraction</text>
    <path class="edge sens-edge" d="M750 195L840 195"/><text class="label purple" x="795" y="182">hasSensoryEvaluation</text>
    <path class="edge domain" d="M750 165C930 103 1210 103 1390 165"/><text class="label green" x="1235" y="119">usesProfile</text>

    <!-- Evidencia explícita -->
    <g class="node status"><rect x="65" y="315" width="270" height="88" rx="9"/><text x="200" y="334"><tspan class="kind" x="200">DECISIÓN DE CALIBRACIÓN</tspan><tspan x="200" dy="22">Rejected</tspan><tspan class="type" x="200" dy="18">ValidationStatus</tspan><tspan class="detail" x="200" dy="16">validatedBy → BaristaA</tspan></text></g>
    <g class="node observation"><rect x="390" y="315" width="400" height="115" rx="9"/><text x="590" y="334"><tspan class="kind" x="590">8 × OBSERVATION</tspan><tspan x="590" dy="21">18 g dosis · 36 g bebida · 28 s</tspan><tspan class="detail" x="590" dy="17">93 °C · 9 bar · estabilidad 0,4 °C</tspan><tspan class="detail" x="590" dy="16">TDS 10,25 % · rendimiento 20,5 %</tspan><tspan class="type" x="590" dy="17">observaciones de C9Extraction</tspan></text></g>
    <g class="node defect"><rect x="870" y="315" width="270" height="88" rx="9"/><text x="1005" y="334"><tspan class="kind" x="1005">DEFECTO SENSORIAL</tspan><tspan x="1005" dy="22">PersistentUnpleasantTaste</tspan><tspan class="type" x="1005" dy="18">SensoryDefect</tspan><tspan class="detail" x="1005" dy="16">sabor desagradable persistente</tspan></text></g>
    <g class="node specification"><rect x="1325" y="315" width="430" height="115" rx="9"/><text x="1540" y="334"><tspan class="kind" x="1540">8 × PROFILEPARAMETERSPECIFICATION</tspan><tspan x="1540" dy="21">dosis 18±0,2 g · bebida 36±1 g · 25–30 s</tspan><tspan class="detail" x="1540" dy="17">92–94 °C · presión 9±0,5 bar · estabilidad 0–0,7 °C</tspan><tspan class="detail" x="1540" dy="16">TDS 8–12 % · rendimiento 19–24 %</tspan><tspan class="type" x="1540" dy="17">especificaciones de perfil_001</tspan></text></g>

    <path class="edge sens-edge" d="M200 245L200 315"/><text class="label purple" x="267" y="283">hasValidationStatus</text>
    <path class="edge obs-edge" d="M590 245L590 315"/><text class="label blue" x="648" y="283">hasObservation</text>
    <path class="edge sens-edge" d="M1005 253L1005 315"/><text class="label purple" x="1080" y="287">hasPerceivedDefect</text>
    <path class="edge obs-edge" d="M1540 245L1540 315"/><text class="label blue" x="1623" y="283">hasParameterSpecification</text>

    <!-- Operación externa -->
    <g class="engine"><rect x="170" y="505" width="1460" height="120" rx="12"/><text x="900" y="526" text-anchor="middle"><tspan class="kind" x="900">PROCESAMIENTO EXTERNO · EvidenceBasedReasoner</tspan><tspan class="main" x="900" dy="24">Compara las ocho observaciones con las ocho especificaciones y lee la decisión sensorial del barista</tspan><tspan class="result" x="900" dy="24">8/8 especificaciones conformes · ninguna TechnicalDeviation · SensoryRejected · calibración Rejected</tspan><tspan class="detail" x="900" dy="21">Materializa por separado la conformidad técnica y el diagnóstico sensorial probable, conservando la evidencia utilizada</tspan></text></g>
    <path class="edge operation" d="M200 403C240 455 330 470 430 505"/>
    <path class="edge operation" d="M590 430L680 505"/>
    <path class="edge operation" d="M1005 403C1040 452 1060 470 1080 505"/>
    <path class="edge operation" d="M1540 430L1330 505"/>

    <!-- Conocimiento materializado -->
    <g class="node assessment"><rect x="210" y="690" width="500" height="140" rx="9"/><text x="460" y="709"><tspan class="kind" x="460">EVALUACIÓN DE CONFORMIDAD TÉCNICA</tspan><tspan x="460" dy="21">La extracción cumple el perfil</tspan><tspan class="type" x="460" dy="17">TechnicalConformanceAssessment</tspan><tspan class="detail" x="460" dy="16">hasTechnicalConformance → TechnicallyConformant</tspan><tspan class="detail" x="460" dy="16">assessesExtraction → C9Extraction · againstProfile → perfil_001</tspan><tspan class="detail" x="460" dy="16">derivedFrom → 8 observaciones + 8 especificaciones</tspan></text></g>
    <g class="node diagnosis"><rect x="930" y="695" width="650" height="135" rx="9"/><text x="1255" y="714"><tspan class="kind" x="1255">DIAGNÓSTICO PROBABLE</tspan><tspan x="1255" dy="21">Rechazo sensorial sin incumplimiento técnico</tspan><tspan class="detail" x="1255" dy="18">La calibración fue rechazada por el sabor desagradable persistente,</tspan><tspan class="detail" x="1255" dy="16">no por una desviación de los valores registrados.</tspan><tspan class="type" x="1255" dy="17">Diagnosis · probable-diagnosis</tspan><tspan class="detail" x="1255" dy="16">derivedFrom → calibración, extracción, evaluación y evidencia técnica</tspan></text></g>
    <path class="edge operation" d="M600 625L460 690"/><text class="label gray" x="510" y="660">materializa</text>
    <path class="edge operation" d="M1200 625L1255 695"/><text class="label gray" x="1250" y="662">materializa</text>

    <!-- Procedencia del nuevo conocimiento: flechas desde el resultado hacia su evidencia -->
    <path class="edge provenance" d="M300 690C250 625 300 472 445 430"/><text class="label blue" x="290" y="555">derivedFrom</text>
    <path class="edge diagnostic-edge" d="M1500 695C1645 690 1680 655 1680 625L1680 475C1680 430 1400 420 1140 403"/><text class="label orange" x="1638" y="455">isDiagnosisOf</text>

    <!-- Explicación y acción sugerida -->
    <g class="node explanation"><rect x="340" y="925" width="680" height="145" rx="9"/><text x="680" y="944"><tspan class="kind" x="680">EXPLICACIÓN PROBABLE</tspan><tspan x="680" dy="22">Conformidad técnica y aceptación sensorial son dimensiones distintas.</tspan><tspan class="detail" x="680" dy="19">El perfil describe límites medibles, pero no predijo por completo la aceptación</tspan><tspan class="detail" x="680" dy="17">para este café y contexto. La evidencia no permite aislar una causa técnica única.</tspan><tspan class="type" x="680" dy="19">ExplanationAssertion · probable-explanation</tspan></text></g>
    <g class="node recommendation"><rect x="1100" y="925" width="580" height="145" rx="9"/><text x="1390" y="944"><tspan class="kind" x="1390">PRUEBA RECOMENDADA</tspan><tspan x="1390" dy="22">Iniciar otra calibración cambiando un solo parámetro.</tspan><tspan class="detail" x="1390" dy="19">Comenzar por la molienda, mantener los demás parámetros y volver a evaluar.</tspan><tspan class="type" x="1390" dy="19">RecommendedAction · adjustsProperty → GrindSetting</tspan></text></g>
    <g class="node guidance"><rect x="1205" y="1120" width="370" height="58" rx="9"/><text x="1390" y="1138"><tspan class="kind" x="1390">PROCEDIMIENTO DOCUMENTADO</tspan><tspan x="1390" dy="21">IterativeCalibrationProcedure · CalibrationProcedure</tspan></text></g>

    <path class="edge knowledge-edge" d="M680 925C780 855 965 830 1080 830"/><text class="label gold" x="880" y="860">explains</text>
    <path class="edge knowledge-edge" d="M1390 925C1390 875 1360 850 1335 830"/><text class="label gold" x="1432" y="872">respondsTo</text>
    <path class="edge knowledge-edge" d="M1390 1070L1390 1120"/><text class="label gold" x="1465" y="1100">followsProcedure</text>
  
</g>
<g id="leyenda" aria-label="Leyenda del diagrama"><rect class="export-footer-bg" x="0" y="1330" width="1800" height="66"/><line x1="26" y1="1360" x2="56" y2="1360" stroke="#347848" stroke-width="2"/><text class="export-legend" x="65" y="1364" text-anchor="start"><tspan x="65" dy="0">Relación formal</tspan></text><line x1="188.0" y1="1360" x2="218.0" y2="1360" stroke="#2876ad" stroke-width="2"/><text class="export-legend" x="227" y="1364" text-anchor="start"><tspan x="227" dy="0">Observación o especificación</tspan></text><line x1="433.20000000000005" y1="1360" x2="463.20000000000005" y2="1360" stroke="#8995a2" stroke-width="2" stroke-dasharray="6 5"/><text class="export-legend" x="472.2" y="1364" text-anchor="start"><tspan x="472.2" dy="0">Operación externa</tspan></text><line x1="608.0" y1="1360" x2="638.0" y2="1360" stroke="#2876ad" stroke-width="2" stroke-dasharray="2 5"/><text class="export-legend" x="647" y="1364" text-anchor="start"><tspan x="647" dy="0">Procedencia</tspan></text><line x1="744.4" y1="1360" x2="774.4" y2="1360" stroke="#d9602e" stroke-width="2" stroke-dasharray="2 5"/><text class="export-legend" x="783.4" y="1364" text-anchor="start"><tspan x="783.4" dy="0">Relación diagnóstica</tspan></text><line x1="938.4" y1="1360" x2="968.4" y2="1360" stroke="#b67912" stroke-width="2"/><text class="export-legend" x="977.4" y="1364" text-anchor="start"><tspan x="977.4" dy="0">Explicación o recomendación</tspan></text><text class="export-footer-note" x="1774" y="1364" text-anchor="end"><tspan x="1774" dy="0">Ontología 3.5.0 · Caso 9 · datos sintéticos</tspan></text></g>
</svg>
